{% extends 'socialaccount/base.html' %}
{% load i18n crispy_forms_tags %}
{% block social_content %}
<h2>{% trans "Login via social networks" %}</h2>
<p><small>{% trans "You are about to sign in via the social network. Click Continue to proceed." %}</small></p>
<form method="POST">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn boxed-btn3 btn-block mt-3">{% trans "Continue" %}</button>
</form>
{% endblock social_content %}
