{% load i18n %}
<h3 class="footer_title">
    {% trans "Subscribe to the newsletter" %}
</h3>
<form action="{% url 'subscribeapp:subscribe' %}" class="newsletter_form" method="post">
    {% csrf_token %}
    {{ subscribe_form }}
    <button type="submit">{% trans "Subscribe" %}</button>
</form>
<p class="newsletter_text">{% trans "receive information about new articles and scenarios" %}</p>
