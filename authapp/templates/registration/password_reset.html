{% extends 'base_auth.html'%}
{% load crispy_forms_tags %}
{% load i18n %}
{% block content %}
    <h2>{% trans "Password recovery" %}</h2>
    <form method="POST">  
        {% csrf_token %}  
        {{ form|crispy }}  
        <button type="submit" class="btn btn-danger mt-3">{% trans "Request a new password" %}</button>  
    </form>
{% endblock content%}
