{% extends 'base_auth.html'%}
{% load i18n %}
{% block content %}
    <h2>{% trans "Password change" %}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn boxed-btn3 btn-block mt-3">{% trans "Change password" %}</button>
    </form>
    <p>
        <div class="col">
            <a href="{% url 'mainapp:personal_page' username=user.username %}">{% trans "Back to personal account" %}</a>
        </div>
    </p>
{% endblock content%}
